.dlbar{position:fixed;right:22px;bottom:22px;z-index:99}
.dlbar button{border:none;background:#A8552F;color:#fff;font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.5px;padding:11px 20px;border-radius:24px;cursor:pointer;box-shadow:0 4px 16px rgba(168,85,47,.35);transition:background .15s,transform .15s}
.dlbar button:hover{background:#8F4526;transform:translateY(-1px)}
.dlbar button:disabled{background:#C9A38E;cursor:default;transform:none}
.shot-mask{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(40,28,20,.88);z-index:999;align-items:center;justify-content:center;padding:16px}
.shot-box{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;max-height:100%}
.shot-box img{max-width:100%;max-height:74vh;border-radius:10px;box-shadow:0 10px 34px rgba(0,0,0,.45)}
.shot-tip{color:#F3E7DA;font-size:13px;letter-spacing:.5px}
.shot-close{border:1px solid #C9A38E;background:transparent;color:#F3E7DA;font-family:inherit;font-size:13px;padding:8px 24px;border-radius:20px;cursor:pointer}
/* 截图容器（仅用于生成图片，不参与页面布局） */
.shot-root{background:#F4EEE6;color:#3B2D25;font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.5}
.shot-inner{width:100%}
</style></head><body><div class="wrap"><div class="card"><div class="head"><div class="brand"><div class="bar"></div><div><h1>武清政企购</h1><div class="sub">天猫优品双11 · 天津城市购物节</div></div></div><div class="meta"><div class="date">2026-11-18</div><div class="stamp">数据截至 18:41</div><span class="day">第 1 天</span></div></div></div><div class="cards"><div class="numcard c-acc"><div class="lab">累计报名（X）</div><div class="val">13<small>人</small></div></div><div class="numcard c-new"><div class="lab">今日新增（Y）</div><div class="val">9<small>人</small></div></div><div class="numcard c-old"><div class="lab">昨日存量（Z）</div><div class="val">4<small>人</small></div></div></div><div class="card"><div class="chart-title">各门店报名对比</div><div class="chart-note">X = Y + Z · 柱上段=今日新增，柱下段=昨日存量<span class="legend" style="float:right"><span><i style="background:#A8552F"></i>今日新增</span><span><i style="background:#E6DCCB;border:1px solid #D8C9B8"></i>昨日存量</span></span></div><svg viewBox="0 0 690 300" xmlns="http://www.w3.org/2000/svg"><line x1="48" y1="252.0" x2="666" y2="252.0" stroke="#F0E5D4" stroke-width="1" stroke-dasharray="3 4"/><text x="40" y="252.0" text-anchor="end" font-size="10" fill="#B3A28F" dy="3">0</text><line x1="48" y1="199.0" x2="666" y2="199.0" stroke="#F0E5D4" stroke-width="1" stroke-dasharray="3 4"/><text x="40" y="199.0" text-anchor="end" font-size="10" fill="#B3A28F" dy="3">2</text><line x1="48" y1="146.0" x2="666" y2="146.0" stroke="#F0E5D4" stroke-width="1" stroke-dasharray="3 4"/><text x="40" y="146.0" text-anchor="end" font-size="10" fill="#B3A28F" dy="3">4</text><line x1="48" y1="93.0" x2="666" y2="93.0" stroke="#F0E5D4" stroke-width="1" stroke-dasharray="3 4"/><text x="40" y="93.0" text-anchor="end" font-size="10" fill="#B3A28F" dy="3">6</text><line x1="48" y1="40.0" x2="666" y2="40.0" stroke="#F0E5D4" stroke-width="1" stroke-dasharray="3 4"/><text x="40" y="40.0" text-anchor="end" font-size="10" fill="#B3A28F" dy="3">8</text><path d="M 80 152.0 Q 80 146.0 86 146.0 L 114 146.0 Q 120 146.0 120 152.0 L 120 252.0 L 80 252.0 Z" fill="#A8552F"/><text x="100" y="199.0" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFDF9" dy="4">4</text><text x="100" y="146.0" text-anchor="middle" font-size="13" font-weight="800" fill="#3B2D25" dy="-8">4</text><text x="100" y="272" text-anchor="middle" font-size="12" fill="#5E5246">中信广场天猫</text><path d="M 200 178.5 Q 200 172.5 206 172.5 L 234 172.5 Q 240 172.5 240 178.5 L 240 252.0 L 200 252.0 Z" fill="#A8552F"/><text x="220" y="212.2" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFDF9" dy="4">3</text><text x="220" y="172.5" text-anchor="middle" font-size="13" font-weight="800" fill="#3B2D25" dy="-8">3</text><text x="220" y="272" text-anchor="middle" font-size="12" fill="#5E5246">北辰天猫</text><rect x="320" y="249" width="40" height="3" rx="1.5" fill="#D8C9B8"/><text x="340" y="252" text-anchor="middle" font-size="12" fill="#B3A28F" dy="-8">0</text><text x="340" y="272" text-anchor="middle" font-size="12" fill="#5E5246">大寺龙居天猫</text><path d="M 440 178.5 Q 440 172.5 446 172.5 L 474 172.5 Q 480 172.5 480 178.5 L 480 225.5 L 440 225.5 Z" fill="#A8552F"/><text x="460" y="199.0" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFDF9" dy="4">2</text><rect x="440" y="225.5" width="40" height="26.5" fill="#E6DCCB"/><text x="460" y="238.8" text-anchor="middle" font-size="12" font-weight="600" fill="#8A7866" dy="4">1</text><text x="460" y="172.5" text-anchor="middle" font-size="13" font-weight="800" fill="#3B2D25" dy="-8">3</text><text x="460" y="272" text-anchor="middle" font-size="12" fill="#5E5246">平河天猫</text><rect x="560" y="172.5" width="40" height="79.5" fill="#E6DCCB"/><text x="580" y="212.2" text-anchor="middle" font-size="12" font-weight="600" fill="#8A7866" dy="4">3</text><text x="580" y="172.5" text-anchor="middle" font-size="13" font-weight="800" fill="#3B2D25" dy="-8">3</text><text x="580" y="272" text-anchor="middle" font-size="12" fill="#5E5246">东蒲洼天猫</text><line x1="48" y1="252" x2="666" y2="252" stroke="#D8C9B8" stroke-width="1.5"/></svg></div><div class="card"><div class="chart-title">门店明细</div><table><tr><th>门店</th><th>累计报名 X</th><th>今日新增 Y</th><th>昨日存量 Z</th></tr><tr><td>中信广场天猫</td><td><b>4</b></td><td><b>4</b></td><td>0</td></tr><tr><td>北辰天猫</td><td><b>3</b></td><td><b>3</b></td><td>0</td></tr><tr><td>大寺龙居天猫</td><td><b>0</b></td><td><b>0</b></td><td>0</td></tr><tr><td>平河天猫</td><td><b>3</b></td><td><b>2</b></td><td>1</td></tr><tr><td>东蒲洼天猫</td><td><b>3</b></td><td><b>0</b></td><td>3</td></tr><tr class="total"><td>合计</td><td>13</td><td>9</td><td>4</td></tr></table></div><div class="foot">数据源：天津城市购物节 10 条 + 东蒲洼·城市购物节 3 条（后台报名记录，均已结算）· 累计X = 今日新增Y + 昨日存量Z</div></div><div class="dlbar"><button type="button" id="saveBtn">⤓ 保存为图片</button></div><div class="shot-mask" id="shotMask"><div class="shot-box"><img id="shotImg" alt="日报图片"><div class="shot-tip">长按图片保存到相册</div><button type="button" class="shot-close" id="shotClose">关闭</button></div></div><script>
(function(){
  var btn = document.getElementById('saveBtn');
  var wrap = document.querySelector('.wrap');
  var mask = document.getElementById('shotMask');
  var shotImg = document.getElementById('shotImg');
  var closeBtn = document.getElementById('shotClose');
  if (!btn || !wrap) return;

  function reset(){ btn.disabled = false; btn.textContent = '\u2913 保存为图片'; }
  function fail(msg){ reset(); alert(msg); }

  if (closeBtn) closeBtn.addEventListener('click', function(){ mask.style.display = 'none'; });
  if (mask) mask.addEventListener('click', function(e){
    if (e.target === mask) mask.style.display = 'none';
  });

  btn.addEventListener('click', function(){
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = '生成中…';
    setTimeout(function(){
      try { build(); } catch(e) { fail('生成失败：' + e.message); }
    }, 40);
  });

  function build(){
    var scale = 2, pad = 22;
    var w = wrap.offsetWidth;
    var h = wrap.offsetHeight;
    var TW = w + pad * 2, TH = h + pad * 2;

    var css = '';
    var st = document.getElementsByTagName('style');
    for (var i = 0; i < st.length; i++) css += st[i].textContent;

    var xhtml =
      '<div xmlns="http://www.w3.org/1999/xhtml" class="shot-root" ' +
      'style="width:' + w + 'px;padding:' + pad + 'px">' +
      '<style>' + css + '</style>' +
      '<div class="shot-inner">' + wrap.innerHTML + '</div></div>';

    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + TW + '" height="' + TH + '">' +
      '<foreignObject x="0" y="0" width="' + TW + '" height="' + TH + '">' +
      xhtml + '</foreignObject></svg>';

    var img = new Image();
    img.onload = function(){
      try {
        var canvas = document.createElement('canvas');
        canvas.width = TW * scale;
        canvas.height = TH * scale;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#F4EEE6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);
        deliver(canvas);
      } catch(e) { fail('渲染失败：' + e.message); }
    };
    img.onerror = function(){ fail('图片渲染失败，可用系统截图保存'); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function deliver(canvas){
    var m = (document.title || '').match(/(\d{4}-\d{2}-\d{2})/);
    var name = '武清政企购报名日报' + (m ? '_' + m[1] : '') + '.png';
    var mobile = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger/i.test(navigator.userAgent);

    if (!mobile && canvas.toBlob) {
      canvas.toBlob(function(blob){
        var a = document.createElement('a');
        a.download = name;
        a.href = URL.createObjectURL(blob);
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){
          URL.revokeObjectURL(a.href);
          if (a.parentNode) a.parentNode.removeChild(a);
          reset();
        }, 900);
      }, 'image/png');
    } else {
      shotImg.src = canvas.toDataURL('image/png');
      mask.style.display = 'flex';
      reset();
    }
  }
})();
</script></body></html>
